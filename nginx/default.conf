server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'" always;

    # utilisé par le HEALTHCHECK Docker et par la CI
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # fichiers statiques : cache court, les noms ne sont pas versionnés
    location ~* \.(css|js|svg|png|jpe?g|webp|woff2?|pdf)$ {
        expires 1h;
        try_files $uri =404;
    }

    # HTML : toujours revalider pour voir la dernière version
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
